<!DOCTYPE html>
<html lang="ko" data-size="md">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>나만의 플래너</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 처음 실행할 때만 보이는 시작 화면 (이름 · 사용 목적 · 테마 선택) -->
  <div id="onboarding" class="onboarding" hidden></div>

  <!-- 메인 앱 -->
  <div id="app" class="app" hidden>

    <!-- PC: 왼쪽 사이드바 -->
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">▦</span> 나만의 플래너</div>
      <nav id="sideNav" class="nav" aria-label="메뉴"></nav>
      <button class="profile-mini" data-action="goTab" data-tab="settings" id="profileMini"></button>
    </aside>

    <main class="main">

      <!-- ① 홈: 일정 입력 + 목록 -->
      <section id="tab-home" class="tab">
        <header class="hero">
          <p id="helloText" class="hero-hello"></p>
          <h1 class="hero-title">남은 일정 <span id="remainCount" class="hero-count">0</span>개</h1>
          <div class="progress" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div>
          <p id="progressText" class="hero-sub"></p>
        </header>

        <div id="friendsToday"></div>

        <!-- 필수 기능 1~3: 일정 입력 / 날짜 지정 / 추가 버튼 -->
        <form id="addForm" class="add-card" autocomplete="off">
          <input id="titleInput" class="title-input" type="text" maxlength="60" placeholder="새 일정을 입력하세요" aria-label="일정 제목">
          <div class="add-row">
            <input id="dateInput" class="field" type="date" aria-label="날짜">
            <select id="catInput" class="field" aria-label="카테고리"></select>
            <button type="button" id="starBtn" class="star-toggle" aria-pressed="false" title="중요 일정으로 표시">☆</button>
            <label class="check-inline"><input type="checkbox" id="shareInput"> 친구에게 공유</label>
            <button type="submit" class="btn primary add-btn">추가</button>
          </div>
        </form>

        <!-- 추가 기능: 검색 / 필터 / 완료 숨기기 -->
        <div class="filters">
          <input id="searchInput" class="search" type="search" placeholder="일정 검색" aria-label="일정 검색">
          <div id="rangeChips" class="chips" role="group" aria-label="기간 필터"></div>
          <div id="catChips" class="chips" role="group" aria-label="카테고리 필터"></div>
          <label class="check-inline"><input type="checkbox" id="hideDone"> 완료한 일정 숨기기</label>
        </div>

        <p id="listMeta" class="list-meta"></p>
        <!-- 필수 기능 4: 일정 목록 -->
        <div id="eventList"></div>
      </section>

      <!-- ② 달력 -->
      <section id="tab-calendar" class="tab" hidden>
        <div class="cal-head">
          <button class="icon-btn" data-action="prevMonth" aria-label="이전 달">‹</button>
          <h2 id="calTitle" class="cal-title"></h2>
          <button class="icon-btn" data-action="nextMonth" aria-label="다음 달">›</button>
          <button class="btn ghost small" data-action="thisMonth">오늘</button>
        </div>
        <div class="cal">
          <div class="cal-week"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>
          <div id="calGrid" class="cal-grid"></div>
        </div>
        <div id="calLegend" class="legend"></div>
        <div id="dayPanel" class="day-panel"></div>
      </section>

      <!-- ③ 친구 · 공유 -->
      <section id="tab-friends" class="tab" hidden></section>

      <!-- ④ 설정 -->
      <section id="tab-settings" class="tab" hidden></section>
    </main>

    <!-- 모바일: 아래쪽 탭 메뉴 -->
    <nav id="tabBar" class="tabbar" aria-label="메뉴"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="script.js"></script>
</body>
</html>
